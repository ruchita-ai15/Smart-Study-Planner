services:
  web:
    build: .
    container_name: smart_study_planner
    ports:
      - "5000:5000"
    volumes:
      # Persist SQLite database file across container restarts
      - ./instance:/app/instance
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=False
      - SECRET_KEY=smart-study-planner-secret-key-prod
      - PORT=5000
    restart: unless-stopped
